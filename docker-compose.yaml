# version: '3.8'

services:

  # ─── Database ───────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: schoolsync_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Database Initializer ────────────────────────────────────
  # Runs once to create both databases, then exits
  db-init:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'schoolsync_auth'" | grep -q 1 || psql -h postgres -U postgres -c "CREATE DATABASE schoolsync_auth"
        psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'schoolsync_student'" | grep -q 1 || psql -h postgres -U postgres -c "CREATE DATABASE schoolsync_student"
    restart: on-failure

  # ─── Auth Service ────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: schoolsync_auth
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: schoolsync_auth
      JWT_SECRET: your_super_secret_key_change_this_in_production
      JWT_EXPIRES_IN: 7d
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # ─── Student Service ─────────────────────────────────────────
  student-service:
    build:
      context: ./student-service
      dockerfile: Dockerfile
    container_name: schoolsync_student
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: schoolsync_student
      JWT_SECRET: your_super_secret_key_change_this_in_production
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started

  attendance-service:
      build:
        context: ./attendance-service
        dockerfile: Dockerfile
      container_name: schoolsync_attendance
      ports:
        - "3003:3003"
      environment:
        PORT: 3003
        MONGODB_URI: mongodb://mongodb:27017/schoolsync_attendance
        JWT_SECRET: your_super_secret_key_change_this_in_production
        AUTH_SERVICE_URL: http://auth-service:3001
        STUDENT_SERVICE_URL: http://student-service:3002
        KAFKA_BROKER: kafka:9092
        NODE_ENV: development
      depends_on:
        mongodb:
          condition: service_healthy
        kafka:
          condition: service_healthy
        student-service:
          condition: service_started

  # ─── MongoDB ─────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: schoolsync_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Zookeeper ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: schoolsync_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: schoolsync_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  mongodb_data: