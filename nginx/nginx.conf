events {
    worker_connections 1024;
}

http {
    # Upstream blocks: give a name to a group of backend servers
    # These map to the services defined in docker-compose.yaml
    
    upstream auth_service {
        server auth-service:3001;
    }

    upstream student_service {
        server student-service:3002;
    }

    upstream attendance_service {
        server attendance-service:3003;
    }

    # Main Server block: listens for incoming requests and routes them to the appropriate upstream

    server {
        listen 8080;

        # CORS headers: handles once, not in each service.

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # Handle preflight requests: sent by browsers for CORS checks before actual requests.

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health Check: for the gateway
        location /health {
            return 200 '{"status": "healthy", service: "api-gateway"}';
            add_header Content-Type application/json;
        }

        # Auth Service routing
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Student Service routing
        location /api/students/ {
            proxy_pass http://student_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Attendance Service routing
        location /api/attendance/ {
            proxy_pass http://attendance_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger docs:
        location /auth/api-docs/ {
            proxy_pass http://auth_service/api-docs/;
            proxy_set_header Host $host;
        }

        location /students/api-docs/ {
            proxy_pass http://student_service/api-docs/;
            proxy_set_header Host $host;
        }

        location /attendance/api-docs/ {
            proxy_pass http://attendance_service/api-docs/;
            proxy_set_header Host $host;
        }
    }
}